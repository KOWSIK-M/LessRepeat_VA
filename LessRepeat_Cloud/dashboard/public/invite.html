<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Activate your LessRepeat workspace</title><link rel="icon" href="/assets/favicon.png"><link rel="stylesheet" href="/assets/admin.css"></head>
<body><main class="auth-wrap"><section class="auth-card"><img src="/assets/lessrepeat-icon-256.png" width="56" height="56" alt="LessRepeat"><p class="eyebrow">YOUR BUSINESS WORKSPACE</p><h1 id="invite-title">Checking invitation…</h1><p id="invite-copy"></p><form id="invite-form" hidden><label>Create password<input id="password" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label><label>Confirm password<input id="confirmation" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label><p class="muted">Use at least 12 characters. Your administrator never sees your password.</p><button type="submit" class="primary">Activate account</button></form><p id="invite-message" role="alert"></p><a href="/app">Go to sign in</a></section></main><script src="/assets/invite.js" defer></script></body></html>
